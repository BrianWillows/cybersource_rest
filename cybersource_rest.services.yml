services:
  logger.channel.cybersource_rest:
    parent: logger.channel_base
    arguments: ['cybersource_rest']

  cybersource_rest.credentials:
    class: Drupal\cybersource_rest\CredentialProvider
    arguments: ['@logger.channel.cybersource_rest', '@settings']

  cybersource_rest.credentials_status:
    class: Drupal\cybersource_rest\CredentialsStatus
    arguments: ['@cybersource_rest.credentials', '@entity_type.manager']

  # Class alias so the autowired hook class (Drupal 11.1+ registers
  # #[Hook] classes as services) can receive CredentialsStatus by type.
  Drupal\cybersource_rest\CredentialsStatus:
    alias: cybersource_rest.credentials_status

  cybersource_rest.api_client:
    class: Drupal\cybersource_rest\CybersourceApiClient
    arguments: ['@cybersource_rest.credentials', '@logger.channel.cybersource_rest']

  cybersource_rest.credentials_check_subscriber:
    class: Drupal\cybersource_rest\EventSubscriber\CredentialsCheckSubscriber
    arguments: ['@router.admin_context', '@current_user', '@entity_type.manager', '@cybersource_rest.credentials', '@messenger', '@cybersource_rest.credentials_status']
    tags:
      - { name: event_subscriber }
