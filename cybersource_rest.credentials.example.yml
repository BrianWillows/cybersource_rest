# Cybersource REST / Microform credentials.
#
# Copy this file to the site's PRIVATE filesystem at:
#   private://keys/cybersource_rest.yml
# i.e. <file_private_path>/keys/cybersource_rest.yml — OUTSIDE the web root —
# readable by the web server user only (e.g. chmod 640). It must NEVER live in
# the docroot, the module directory, or site config / git.
#
# Generate the keyId (Serial Number) + Shared Secret in the Cybersource
# Business Center: Payment Configuration » Key Management » REST APIs »
# Generate Key » "Shared Secret". The merchant_id is your Cybersource
# merchant/organization ID.
#
# One block per mode. A "test" gateway uses the `test` block (apitest.cybersource.com);
# a "live" gateway uses the `live` block (api.cybersource.com). One merchant
# account serves every currency, so — unlike Secure Acceptance — there is no
# per-currency profile here.
#
# Optional: add `key_expiry` (YYYY-MM-DD) if you rotate keys on a schedule. The
# status report then warns a month before that date and errors once it passes.

test:
  merchant_id: your_test_merchant_id
  key_id: 00000000-0000-0000-0000-000000000000
  shared_secret: base64SharedSecretFromTheBusinessCenter==
  key_expiry: "2027-01-01"   # optional (YYYY-MM-DD)

live:
  merchant_id: your_live_merchant_id
  key_id: 00000000-0000-0000-0000-000000000000
  shared_secret: base64SharedSecretFromTheBusinessCenter==
  key_expiry: "2027-01-01"   # optional (YYYY-MM-DD)
