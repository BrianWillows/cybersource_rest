name: Cybersource REST (Microform)
type: module
description: 'Cybersource REST / Flex Microform v2 payment gateway for Drupal Commerce. Card data is captured in Cybersource-hosted Microform iframes (the PAN/CVV never touch this server) and charged server-side via the Cybersource REST API. API credentials live in an external private .yml — never in site config.'
package: Commerce
core_version_requirement: ^10.3 || ^11 || ^12
dependencies:
  - commerce:commerce_payment
  - commerce:commerce_order
  - commerce:commerce_price
  - commerce:commerce_log
